services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: northstar
      POSTGRES_PASSWORD: northstar
      POSTGRES_DB: northstar
    ports:
      - "5432:5432"
    volumes:
      - northstar_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northstar -d northstar"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - northstar_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  object-storage:
    image: chrislusf/seaweedfs:latest
    environment:
      AWS_ACCESS_KEY_ID: northstar
      AWS_SECRET_ACCESS_KEY: northstar-local-secret
      S3_BUCKET: northstar-local
    ports:
      - "8333:8333"
      - "8888:8888"
      - "9333:9333"
      - "23646:23646"
    volumes:
      - northstar_object_storage:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  northstar_postgres:
  northstar_redis:
  northstar_object_storage:
